<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>반사신경 터치 게임</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:        #0d0f14;
      --surface:   #161b25;
      --surface2:  #1e2635;
      --accent:    #e63946;
      --accent-glow: rgba(230, 57, 70, 0.45);
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --score-col: #38bdf8;
      --time-col:  #facc15;
      --radius:    18px;
      --font:      'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ── HUD (상단 바) ── */
    #hud {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface2);
      z-index: 10;
    }

    .hud-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .hud-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hud-value {
      font-size: 40px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    #score-val  { color: var(--score-col); }
    #time-val   { color: var(--time-col);  }

    /* 시간이 5초 이하일 때 깜빡임 */
    #time-val.urgent {
      animation: blink 0.5s step-end infinite;
    }
    @keyframes blink {
      50% { opacity: 0.3; }
    }

    /* ── 게임 필드 ── */
    #field {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    /* 배경 격자 패턴 (미묘하게) */
    #field::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--surface2) 1px, transparent 1px),
        linear-gradient(90deg, var(--surface2) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.35;
      pointer-events: none;
    }

    /* ── 타겟(빨간 원) ── */
    #target {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b7a, var(--accent));
      box-shadow:
        0 0 0 4px rgba(230, 57, 70, 0.25),
        0 0 24px var(--accent-glow),
        0 0 48px rgba(230, 57, 70, 0.15);
      cursor: pointer;
      transform: translate(-50%, -50%) scale(1);
      transition: left 0.08s ease-out, top 0.08s ease-out;
      animation: pulse 0.9s ease-in-out infinite;
      z-index: 5;
      display: none;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(230,57,70,.25), 0 0 24px var(--accent-glow); }
      50%       { box-shadow: 0 0 0 8px rgba(230,57,70,.15), 0 0 40px rgba(230,57,70,.5); }
    }

    /* 터치 피드백 */
    #target.hit {
      animation: hitFlash 0.18s ease-out forwards;
    }
    @keyframes hitFlash {
      0%   { transform: translate(-50%,-50%) scale(1.35); opacity: 1; }
      100% { transform: translate(-50%,-50%) scale(0.5);  opacity: 0; }
    }

    /* 파티클 */
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 6;
    }

    /* ── 오버레이 공통 ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: rgba(13, 15, 20, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 20;
      padding: 32px;
    }

    .overlay.hidden { display: none; }

    .overlay-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .overlay-sub {
      font-size: 15px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
    }

    /* ── 버튼 ── */
    .btn {
      padding: 16px 48px;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff4d5a, var(--accent));
      color: #fff;
      box-shadow: 0 8px 28px rgba(230,57,70,0.45);
    }

    .btn-primary:active {
      box-shadow: 0 4px 14px rgba(230,57,70,0.35);
    }

    /* ── 카운트다운 숫자 ── */
    #countdown-num {
      font-size: 100px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      animation: countPop 0.6s ease-out;
    }

    @keyframes countPop {
      0%   { transform: scale(1.5); opacity: 0; }
      40%  { transform: scale(0.9); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }

    /* ── 결과 화면 ── */
    #result-score {
      font-size: 72px;
      font-weight: 900;
      color: var(--score-col);
      letter-spacing: -0.03em;
      text-shadow: 0 0 30px rgba(56,189,248,0.4);
    }

    #result-rank {
      font-size: 22px;
      font-weight: 700;
      color: var(--time-col);
    }

    /* ── 히트 팝업 텍스트 ── */
    .hit-text {
      position: absolute;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      pointer-events: none;
      z-index: 7;
      animation: floatUp 0.55s ease-out forwards;
    }

    @keyframes floatUp {
      0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
      100% { transform: translate(-50%, -120%) scale(0.7); opacity: 0; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- HUD -->
  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">점수</span>
      <span class="hud-value" id="score-val">0</span>
    </div>
    <div class="hud-block">
      <span class="hud-label">남은 시간</span>
      <span class="hud-value" id="time-val">30</span>
    </div>
  </div>

  <!-- 게임 필드 -->
  <div id="field">
    <div id="target"></div>

    <!-- 시작 오버레이 -->
    <div class="overlay" id="overlay-start">
      <div class="overlay-title">⚡ 반사신경 터치</div>
      <div class="overlay-sub">30초 안에 빨간 원을 최대한<br>빠르게 터치하세요!</div>
      <button class="btn btn-primary" id="btn-start">게임 시작</button>
    </div>

    <!-- 카운트다운 오버레이 -->
    <div class="overlay hidden" id="overlay-countdown">
      <div class="overlay-sub">준비하세요!</div>
      <div id="countdown-num">3</div>
    </div>

    <!-- 결과 오버레이 -->
    <div class="overlay hidden" id="overlay-result">
      <div class="overlay-title">게임 오버!</div>
      <div id="result-score">0</div>
      <div id="result-rank"></div>
      <div class="overlay-sub" id="result-hits"></div>
      <button class="btn btn-primary" id="btn-restart">다시 시작</button>
    </div>

  </div><!-- /field -->
</div><!-- /app -->

<script>
  /* ════════════════════════════════
     상태
  ════════════════════════════════ */
  const State = {
    score:    0,
    timeLeft: 30,
    hits:     0,
    running:  false,
    moveTimer:  null,
    gameTimer:  null,
  };

  /* ════════════════════════════════
     DOM 참조
  ════════════════════════════════ */
  const field          = document.getElementById('field');
  const target         = document.getElementById('target');
  const scoreVal       = document.getElementById('score-val');
  const timeVal        = document.getElementById('time-val');
  const overlayStart   = document.getElementById('overlay-start');
  const overlayCountdown = document.getElementById('overlay-countdown');
  const overlayResult  = document.getElementById('overlay-result');
  const countdownNum   = document.getElementById('countdown-num');
  const resultScore    = document.getElementById('result-score');
  const resultRank     = document.getElementById('result-rank');
  const resultHits     = document.getElementById('result-hits');
  const btnStart       = document.getElementById('btn-start');
  const btnRestart     = document.getElementById('btn-restart');

  /* ════════════════════════════════
     더블탭 확대 방지
  ════════════════════════════════ */
  let lastTap = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTap < 300) e.preventDefault();
    lastTap = now;
  }, { passive: false });

  /* ════════════════════════════════
     유틸
  ════════════════════════════════ */
  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function getRank(score) {
    if (score >= 250) return { emoji: '🏆', label: '전설' };
    if (score >= 180) return { emoji: '🥇', label: '마스터' };
    if (score >= 120) return { emoji: '🥈', label: '고수' };
    if (score >= 60)  return { emoji: '🥉', label: '중수' };
    return { emoji: '💪', label: '도전자' };
  }

  /* ════════════════════════════════
     타겟 이동
  ════════════════════════════════ */
  function moveTarget() {
    const margin  = 40; // 화면 가장자리 여백
    const fieldW  = field.clientWidth;
    const fieldH  = field.clientHeight;
    const x = rand(margin, fieldW  - margin);
    const y = rand(margin, fieldH - margin);
    target.style.left = x + 'px';
    target.style.top  = y + 'px';
  }

  /* ════════════════════════════════
     파티클 & 히트 텍스트 효과
  ════════════════════════════════ */
  function spawnParticles(x, y) {
    const colors = ['#e63946','#ff6b7a','#facc15','#38bdf8','#fff'];
    for (let i = 0; i < 8; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = x + 'px';
      p.style.top  = y + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      const angle = (i / 8) * Math.PI * 2;
      const dist  = rand(30, 70);
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      field.appendChild(p);
      p.animate([
        { transform: `translate(-50%,-50%) translate(0,0) scale(1)`, opacity: 1 },
        { transform: `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(0)`, opacity: 0 },
      ], { duration: 400, easing: 'ease-out', fill: 'forwards' }).onfinish = () => p.remove();
    }
  }

  function spawnHitText(x, y) {
    const el = document.createElement('div');
    el.className = 'hit-text';
    el.textContent = '+10';
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    field.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  /* ════════════════════════════════
     점수 갱신
  ════════════════════════════════ */
  function updateScore(delta) {
    State.score += delta;
    scoreVal.textContent = State.score;
    // 숫자 튀는 효과
    scoreVal.animate([
      { transform: 'scale(1.4)', color: '#fff' },
      { transform: 'scale(1)',   color: 'var(--score-col)' },
    ], { duration: 250, easing: 'ease-out' });
  }

  /* ════════════════════════════════
     타겟 터치 처리
  ════════════════════════════════ */
  function onTargetHit(e) {
    if (!State.running) return;
    e.stopPropagation();
    e.preventDefault();

    State.hits++;

    // 히트 위치 (터치 or 마우스)
    const rect = target.getBoundingClientRect();
    const fieldRect = field.getBoundingClientRect();
    const cx = rect.left + rect.width  / 2 - fieldRect.left;
    const cy = rect.top  + rect.height / 2 - fieldRect.top;

    spawnParticles(cx, cy);
    spawnHitText(cx, cy);
    updateScore(10);

    // 히트 애니메이션 후 이동
    target.classList.add('hit');
    clearTimeout(State.moveTimer);
    setTimeout(() => {
      target.classList.remove('hit');
      moveTarget();
      scheduleMoveTarget();
    }, 180);
  }

  /* ════════════════════════════════
     자동 이동 스케줄
  ════════════════════════════════ */
  function scheduleMoveTarget() {
    clearTimeout(State.moveTimer);
    State.moveTimer = setTimeout(() => {
      if (!State.running) return;
      moveTarget();
      scheduleMoveTarget();
    }, 1000);
  }

  /* ════════════════════════════════
     게임 타이머 (1초씩)
  ════════════════════════════════ */
  function tickGameTimer() {
    State.timeLeft--;
    timeVal.textContent = State.timeLeft;

    if (State.timeLeft <= 5) {
      timeVal.classList.add('urgent');
    }

    if (State.timeLeft <= 0) {
      endGame();
    } else {
      State.gameTimer = setTimeout(tickGameTimer, 1000);
    }
  }

  /* ════════════════════════════════
     게임 시작 / 종료
  ════════════════════════════════ */
  function startGame() {
    State.score    = 0;
    State.timeLeft = 30;
    State.hits     = 0;
    State.running  = false;
    scoreVal.textContent = '0';
    timeVal.textContent  = '30';
    timeVal.classList.remove('urgent');

    target.style.display = 'none';
    target.classList.remove('hit');

    overlayResult.classList.add('hidden');
    overlayStart.classList.add('hidden');
    overlayCountdown.classList.remove('hidden');

    runCountdown(3);
  }

  function runCountdown(n) {
    countdownNum.textContent = n;
    // CSS 애니메이션 재시작
    countdownNum.style.animation = 'none';
    void countdownNum.offsetWidth; // reflow
    countdownNum.style.animation = '';

    if (n > 0) {
      setTimeout(() => runCountdown(n - 1), 800);
    } else {
      overlayCountdown.classList.add('hidden');
      beginPlay();
    }
  }

  function beginPlay() {
    State.running = true;
    target.style.display = 'block';
    moveTarget();
    scheduleMoveTarget();
    State.gameTimer = setTimeout(tickGameTimer, 1000);
  }

  function endGame() {
    State.running = false;
    clearTimeout(State.moveTimer);
    clearTimeout(State.gameTimer);
    target.style.display = 'none';

    const rank = getRank(State.score);
    resultScore.textContent = State.score;
    resultRank.textContent  = `${rank.emoji} ${rank.label}`;
    resultHits.textContent  = `총 ${State.hits}번 터치했습니다`;

    overlayResult.classList.remove('hidden');
  }

  /* ════════════════════════════════
     이벤트 바인딩
  ════════════════════════════════ */
  // 시작 / 재시작 버튼
  btnStart.addEventListener('touchstart',   startGame, { passive: false });
  btnStart.addEventListener('click',        startGame);
  btnRestart.addEventListener('touchstart', startGame, { passive: false });
  btnRestart.addEventListener('click',      startGame);

  // 타겟 히트 — touchstart 우선 (즉각 반응)
  target.addEventListener('touchstart', onTargetHit, { passive: false });
  target.addEventListener('mousedown',  onTargetHit);
</script>
</body>
</html>
